services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: /app/scripts/start_web
    volumes:
      - ./src:/app/src
    ports:
      - 7004:7070 # Host:Container
    environment:
      - PORT=7070
    env_file: .env.docker.dev
    depends_on:
      db:
        condition: service_healthy

  db:
    build:
      context: ./db
      dockerfile: Dockerfile
    volumes:
      - postgres-data:/var/lib/postgresql/data
    env_file: .env.docker.dev
    ports:
      - 5433:5433
    healthcheck:
      test: pg_isready
      interval: 1s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: /app/scripts/start_celery_worker
    volumes:
      - ./src:/app/src
    env_file: .env.docker.dev
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: /app/scripts/start_celery_beat
    volumes:
      - ./src:/app/src
    env_file: .env.docker.dev
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy

volumes:
  postgres-data:
